name: Container image

# Builds Torquio's container image (Ubuntu 24.04 + the compiled Wine engine, scripts/1-build/Containerfile)
# and publishes it to the GitHub Container Registry. Each image is tagged "build-<hash>", where <hash> is the
# git tree hash of scripts/1-build: the installer computes the same hash from its own copy of Torquio, so it
# always gets the engine built from exactly its Wine build files (and compiles locally when there is none).
# main and develop also get the "latest" and "develop" tags.

on:
  push:
    paths:
      - 'scripts/1-build/**'
      - '.github/workflows/container-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags, for the version recorded in the image

      - name: Work out the image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/torquio-env"
          build="build-$(git rev-parse HEAD:scripts/1-build | cut -c1-12)"
          case "$GITHUB_REF" in
            refs/heads/main) extra=latest ;;
            refs/heads/develop) extra=develop ;;
            *) extra="" ;;
          esac
          {
            echo "image=$image"
            echo "build=$build"
            echo "extra=$extra"
            echo "commit=$(git describe --always --tags)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build files always give the same engine, so an existing build is reused, not rebuilt.
      - name: Check for an existing build
        id: existing
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.build }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.build }} already exists; not rebuilding it."
          fi

      # Compiling Wine (64- and 32-bit) needs more disk space than the runner has free by default
      - name: Free disk space
        if: steps.existing.outputs.found != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.found != 'true'

      - name: Build and publish
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scripts/1-build/Containerfile
          build-args: TORQUIO_COMMIT=${{ steps.meta.outputs.commit }}
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.build }}

      # Wine must start and set up a prefix in the published image
      - name: Test the image
        run: |
          docker run --rm -e WINEPREFIX=/tmp/prefix -e WINEDEBUG=-all -e WINEDLLOVERRIDES="mscoree,mshtml=" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.build }}" bash -c '
              set -e
              timeout 600 /opt/wine-custom/bin/wineboot -i
              timeout 120 /opt/wine-custom/bin/wine cmd /c ver
              timeout 60 /opt/wine-custom/bin/wineserver -w
              cat /opt/wine-custom/share/torquio/build-info'

      - name: Tag ${{ steps.meta.outputs.extra }}
        if: steps.meta.outputs.extra != ''
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.extra }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.build }}"
